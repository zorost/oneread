[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneread"
version = "1.0.0"
description = "A compiler for technical English. Type-check AI prose against ASD-STE100 Issue 9, then emit it to docs, OpenAPI, skills, MCP, CI, Slack, and aviation procedures from one IR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Fereydon Hashemi" },
  { name = "Zorost Intelligence" },
]
keywords = [
  "ASD-STE100",
  "simplified-technical-english",
  "controlled-language",
  "linter",
  "compiler",
  "sarif",
  "mcp",
  "openapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zorost/oneread"
Documentation = "https://zorost.github.io/oneread/"
Issues = "https://github.com/zorost/oneread/issues"
Signal = "https://zorost.com/oneread-compiler-for-technical-english/"
AeroFarr = "https://aerofarr.com"

[project.scripts]
oneread = "oneread.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
